<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DARPAN</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="flex-center" style="min-height: 100vh;">

    <div class="glass-card" style="width: 100%; max-width: 450px; animation: fadeIn 0.5s ease-out;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="index.html" style="text-decoration: none;">
                <h2>🌌 DARPAN</h2>
            </a>
            <p style="opacity: 0.7;">Identify yourself, Traveler.</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <input type="text" id="login-username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="login-password" placeholder="Access Code (Password)" required>
            </div>

            <button type="submit" class="btn" style="width: 100%;">Initiate Link</button>
            <div id="login-error" style="color: var(--plasma-pink); margin-top: 1rem; text-align: center;"></div>
        </form>

        <div style="text-align: center; margin-top: 2rem; opacity: 0.7; font-size: 0.9rem;">
            <p>New to the system? <a href="register.html"
                    style="color: var(--cyber-cyan); text-decoration: none;">Initialize Registration</a></p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Connecting...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard.html';
                } else {
                    errorDiv.textContent = data.error;
                    btn.disabled = false;
                    btn.textContent = 'Initiate Link';
                }
            } catch (error) {
                errorDiv.textContent = 'Connection failed. System offline.';
                btn.disabled = false;
                btn.textContent = 'Initiate Link';
            }
        });
    </script>
</body>

</html>
